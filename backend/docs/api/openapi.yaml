openapi: 3.1.0
info:
  title: Nekadaja API
  version: 1.0.0
  description: 'Kontrak REST API Nekadaja untuk frontend Next.js dan backend Go.

    Spesifikasi ini mengikuti migrations PostgreSQL 000001–000012 yang diberikan.

    Satu order hanya berisi satu produk (quantity selalu 1). Order gratis dibuat

    langsung berstatus paid tanpa membuat payment. Produk berbayar menggunakan Midtrans.

    '
servers:
- url: https://api.nekadaja.com/api/v1
  description: Production
- url: http://localhost:8080/api/v1
  description: Local development
tags:
- name: Health
- name: Authentication
- name: Profile
- name: Catalog
- name: Courses
- name: Lessons
- name: Exams
- name: Certificates
- name: Source Code
- name: Orders
- name: Payments
- name: Refunds
- name: Entitlements
- name: Admin - Catalog
- name: Admin - Learning
- name: Admin - Exams
- name: Admin - Source Code
- name: Admin - Commerce
- name: Admin - Users
- name: Admin - Certificates
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a student account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  writeOnly: true
      responses:
        '201':
          description: Account created; verification email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login and issue access and refresh tokens
      description: Refresh token must be delivered in a Secure, HttpOnly cookie. Never expose its raw value in application
        logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate refresh token and issue a new access token
      security:
      - RefreshCookie: []
      responses:
        '200':
          description: Token rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke current refresh token
      security:
      - RefreshCookie: []
      responses:
        '204':
          description: Logged out and refresh cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      tags:
      - Authentication
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Request password reset
      description: Always return a generic response to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          $ref: '#/components/responses/Message'
  /auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset password using a one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me:
    get:
      tags:
      - Profile
      summary: Get current authenticated user
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Profile
      summary: Update current profile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                avatar_url:
                  type:
                  - string
                  - 'null'
                  format: uri
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/password:
    put:
      tags:
      - Profile
      summary: Change current password
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 8
                  writeOnly: true
      responses:
        '204':
          description: Password changed; other refresh tokens should be revoked
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/oauth/google:
    post:
      tags:
      - Authentication
      summary: Sign in or link account using Google identity token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_token
              properties:
                id_token:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /categories:
    get:
      tags:
      - Catalog
      summary: List product categories
      security: []
      parameters:
      - in: query
        name: product_type
        schema:
          $ref: '#/components/schemas/ProductType'
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
  /products:
    get:
      tags:
      - Catalog
      summary: Browse published products
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - in: query
        name: product_type
        schema:
          $ref: '#/components/schemas/ProductType'
      - in: query
        name: pricing_type
        schema:
          $ref: '#/components/schemas/PricingType'
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - newest
          - oldest
          - price_asc
          - price_desc
          - title
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /products/{slug}:
    get:
      tags:
      - Catalog
      summary: Get published product detail
      security:
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/products:
    get:
      tags:
      - Entitlements
      summary: List products accessible by current user
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owned products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /me/entitlements:
    get:
      tags:
      - Entitlements
      summary: List current user's active and revoked entitlements
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - revoked
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
  /products/{productId}/access:
    get:
      tags:
      - Entitlements
      summary: Check current user's access to a product
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Access result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
  /products/{productId}/claim:
    post:
      tags:
      - Orders
      summary: Claim a free product
      description: Creates a zero-value paid order and its single order item, then grants entitlement in one database
        transaction. No payment record or Midtrans checkout is created. Existing active access is returned idempotently.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Free product claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '200':
          description: Product was already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /courses/{slug}:
    get:
      tags:
      - Courses
      summary: Get course information and curriculum outline
      security:
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Course and section outline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/curriculum:
    get:
      tags:
      - Courses
      summary: Get course curriculum
      security:
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curriculum; private lesson content is omitted without entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumResponse'
  /me/courses:
    get:
      tags:
      - Courses
      summary: List courses owned by current user with progress
      security:
      - BearerAuth: []
      responses:
        '200':
          description: My courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCoursesResponse'
  /lessons/{lessonId}:
    get:
      tags:
      - Lessons
      summary: Get lesson content
      description: Require active product entitlement unless the lesson is marked is_preview. Do not expose unpublished
        lessons.
      security:
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lesson content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /lessons/{lessonId}/progress:
    put:
      tags:
      - Lessons
      summary: Create or update lesson progress
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_position_seconds:
                  type: integer
                  minimum: 0
                is_completed:
                  type: boolean
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgressResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/progress:
    get:
      tags:
      - Courses
      summary: Get current user's course progress
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'
  /exams:
    get:
      tags:
      - Exams
      summary: List published exams available to current user
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exam list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListResponse'
  /exams/{examId}:
    get:
      tags:
      - Exams
      summary: Get exam instructions and questions
      description: Never return is_correct or explanation fields before the attempt is submitted and graded.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exams/{examId}/attempts:
    post:
      tags:
      - Exams
      summary: Start an exam attempt
      description: Enforce entitlement, max_attempts, and one in-progress attempt per user and exam.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ExamId'
      responses:
        '201':
          description: Attempt started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttemptResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exam-attempts/{attemptId}:
    get:
      tags:
      - Exams
      summary: Get current exam attempt
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttemptResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /exam-attempts/{attemptId}/answers:
    put:
      tags:
      - Exams
      summary: Save an answer for a question
      description: For single_choice and true_false, send selected_option_id. For multiple_choice, send selected_option_ids.
        The server validates that every option belongs to the question and attempt.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question_id
              properties:
                question_id:
                  type: string
                  format: uuid
                selected_option_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                selected_option_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /exam-attempts/{attemptId}/submit:
    post:
      tags:
      - Exams
      summary: Submit an exam attempt
      description: Server closes the attempt, calculates score, determines pass status, and persists answers atomically.
        Client-supplied score is never accepted.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Submitted and graded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/exam-attempts:
    get:
      tags:
      - Exams
      summary: List current user's exam history
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exam history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttemptListResponse'
  /me/certificates:
    get:
      tags:
      - Certificates
      summary: List current user's certificates
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'
  /certificates/verify/{certificateNumber}:
    get:
      tags:
      - Certificates
      summary: Public certificate verification
      security: []
      parameters:
      - in: path
        name: certificateNumber
        required: true
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /source-codes/{slug}:
    get:
      tags:
      - Source Code
      summary: Get source code product details and release metadata
      security:
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Source code detail; private download URLs are never included here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCodeDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /source-codes/{sourceCodeId}/versions:
    get:
      tags:
      - Source Code
      summary: List published source code versions
      security: []
      parameters:
      - in: path
        name: sourceCodeId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCodeVersionListResponse'
  /source-codes/{sourceCodeId}/download:
    post:
      tags:
      - Source Code
      summary: Request a temporary download URL
      description: Requires active entitlement. Return a short-lived signed URL for a private object-storage key
        and record the download event in application logs/audit. Never accept storage_key from the client.
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: sourceCodeId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id:
                  type: string
                  format: uuid
                file_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Temporary download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders:
    post:
      tags:
      - Orders
      summary: Create a paid order for one product
      description: Exactly one product per order, quantity is always 1. Backend reads price and pricing rules from
        PostgreSQL. For fixed pricing, client amount is ignored. For PWYW, amount is required and must be at least
        minimum_amount. Free products must use the claim endpoint. Use Idempotency-Key to safely retry.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product_id
              properties:
                product_id:
                  type: string
                  format: uuid
                amount:
                  type: integer
                  minimum: 1
                  description: Required only for PWYW. IDR integer; never floating point.
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/orders:
    get:
      tags:
      - Orders
      summary: List current user's orders
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
  /orders/{orderNumber}:
    get:
      tags:
      - Orders
      summary: Get order detail owned by current user
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderNumber
        required: true
        schema:
          type: string
          maxLength: 50
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    post:
      tags:
      - Orders
      summary: Cancel an unpaid order
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/checkout:
    post:
      tags:
      - Payments
      summary: Create Midtrans checkout for an unpaid order
      description: Creates or reuses a pending payment according to payment state rules. Amount and currency are
        loaded from the order; client cannot override them.
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Get payment status for an owned order
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/midtrans:
    post:
      tags:
      - Payments
      summary: Receive Midtrans payment notification
      description: Public provider callback. Verify signature_key using the server-side Midtrans server key, validate
        order_id and gross_amount, persist event idempotently, then update payment/order and grant entitlement in
        a database transaction. Never grant access based on browser redirect.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - order_id
              - status_code
              - gross_amount
              - signature_key
              properties:
                order_id:
                  type: string
                status_code:
                  type: string
                gross_amount:
                  type: string
                signature_key:
                  type: string
                  writeOnly: true
                transaction_id:
                  type: string
                transaction_status:
                  type: string
                payment_type:
                  type: string
                fraud_status:
                  type: string
      responses:
        '200':
          description: Notification accepted or already processed
        '400':
          $ref: '#/components/responses/BadRequest'
