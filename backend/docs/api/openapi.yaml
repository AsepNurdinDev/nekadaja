components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Do not store refresh token in JavaScript storage.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Opaque refresh token; server stores only token_hash in refresh_tokens.
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Slug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        maxLength: 255
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      in: path
      name: courseId
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      in: path
      name: lessonId
      required: true
      schema:
        type: string
        format: uuid
    ExamId:
      in: path
      name: examId
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Client-generated UUID or opaque unique value. Backend must persist and replay the result for
        a repeated key and same authenticated user/operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    ProductType:
      type: string
      enum:
      - course
      - source_code
    PricingType:
      type: string
      enum:
      - free
      - fixed
      - pwyw
    OrderStatus:
      type: string
      enum:
      - pending_payment
      - paid
      - cancelled
      - expired
      - partially_refunded
      - refunded
    PaymentStatus:
      type: string
      enum:
      - pending
      - paid
      - failed
      - expired
      - cancelled
      - refunded
      - partially_refunded
    RefundStatus:
      type: string
      enum:
      - requested
      - approved
      - rejected
      - processing
      - succeeded
      - failed
    Money:
      type: integer
      minimum: 0
      description: Amount in the smallest IDR unit (whole rupiah); never use floating point.
    PaginationMeta:
      type: object
      required:
      - page
      - limit
      - total
      - total_pages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    SuccessEnvelope:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          oneOf:
          - type: object
          - type: 'null'
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
