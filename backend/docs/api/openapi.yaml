        '200':
          description: Refund list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundListResponse'
    post:
      tags:
      - Refunds
      summary: Request a refund for a successful payment
      description: Refund amount must be positive and total active/succeeded refunds must not exceed payment amount.
        Access revocation policy is applied only after refund succeeds and is handled transactionally.
      security:
